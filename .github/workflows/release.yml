name: Build e Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*.dmg
            release/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node build.mjs
      - name: Teste de fumaça (abre o app de verdade no Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path site | Out-Null
          Set-Content site/index.html '<!doctype html><h1>Ola</h1>'
          Set-Content site/app.js 'console.log(1)'
          $env:LEZX_USER_DATA = "$PWD\perfil-teste"
          $env:LEZX_SHOT = "$PWD\windows-smoke.png"
          $env:LEZX_EVAL = "$PWD\ci\smoke.js"
          $env:LEZX_WAIT = "9500"
          $env:LEZX_QUIT = "1"
          npx electron . "$PWD\site" 2>&1 | Select-String -Pattern 'SMOKE|shot saved|rror'
          if (!(Test-Path windows-smoke.png)) { throw 'A captura de tela não foi gerada' }
      - uses: actions/upload-artifact@v4
        with: { name: windows-smoke, path: windows-smoke.png }
      - run: npm run dist:win
      - name: Testa o instalador (silencioso) e o comando lezx no PATH
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $found = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Lezx Code.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$found) { Get-ChildItem "$env:LOCALAPPDATA\Programs" | Out-String | Write-Host; throw 'App não instalado' }
          Write-Host "App instalado em: $($found.FullName)"
          $res = Join-Path $found.DirectoryName 'resources'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          Write-Host "PATH do usuário: $userPath"
          if (($userPath -split ';') -notcontains $res) { throw 'O instalador não colocou o lezx no PATH' }
          if (!(Test-Path "$res\lezx.cmd")) { throw 'lezx.cmd não encontrado' }
          Write-Host "OK: app instalado e lezx.cmd no PATH"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: release/*.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist-ci }
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist-ci/*
          cd dist-ci && sha256sum mac/* windows/* > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          gh release create "$GITHUB_REF_NAME" --title "Lezx Code ${GITHUB_REF_NAME#v}" --notes-file ci/release-notes.md \
            dist-ci/mac/* dist-ci/windows/* dist-ci/SHA256SUMS.txt
